on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/mojtaba/ahzarrefigh app/src/main/res/values
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='AhzarRefigh'; include ':app'
          EOT
          cat > build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          EOT
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android { namespace 'com.mohtaba.ahzarrefigh'; compileSdk 35
            defaultConfig { applicationId 'com.mohtaba.ahzarrefigh'; minSdk 23; targetSdk 35; versionCode 1; versionName '1.0' }
          }
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application android:theme="@style/AppTheme" android:label="احضار رفیق"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOT
          printf '%s' '<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#2563eb</item></style></resources>' > app/src/main/res/values/styles.xml
          cat > app/src/main/java/com/mojtaba/ahzarrefigh/MainActivity.java <<'EOT'
          package com.mohtaba.ahzarrefigh;
          import android.app.*;import android.os.*;import android.Manifest;import android.content.pm.PackageManager;import android.webkit.*;import android.graphics.Color;
          public class MainActivity extends Activity{public void onCreate(Bundle b){super.onCreate(b);if(Build.VERSION.SDK_INT>=33&&checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},7);WebView w=new WebView(this);w.setBackgroundColor(Color.rgb(11,16,32));w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.setWebViewClient(new WebViewClient());w.loadUrl("https://mojtaba2216.github.io/ahzar-refigh/");setContentView(w);}}
          EOT
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ahzar-refigh-apk
          path: app/build/outputs/apk/debug/app-debug.apkname: Build Android APK
