name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        run: npm init -y && npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Configure Capacitor
        run: echo '{"appId":"com.mohtaba.ahzarrefigh","appName":"احضار رفیق","webDir":"."}' > capacitor.config.json
      - name: Create Android project
        run: npx cap add android
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug
          build-root-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ahzar-refigh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
